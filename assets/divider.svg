<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6" viewBox="0 0 900 6">
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat">
      <stop offset="0%" stop-color="#70a5fd"/>
      <stop offset="33%" stop-color="#bf91f3"/>
      <stop offset="66%" stop-color="#38bdae"/>
      <stop offset="100%" stop-color="#70a5fd"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="6" rx="3" fill="url(#flow)"/>
</svg>
